# Gravitino 1.3.0 full server, running the Iceberg REST service as an auxiliary
# (embedded) service, with the dynamic catalog-config provider.
#
# In this mode the IRC endpoint is not a separate process with its own static
# catalog config -- the main Gravitino server owns the catalog (created via a
# POST to /api/metalakes/{metalake}/catalogs, see ../scripts/create-catalog.sh),
# and the embedded IRC aux service asks the main server for that catalog's
# config on every request.
#
# Two separate Postgres databases are in play here and are easy to conflate:
#   - gravitino.entity.store.relational.jdbcUrl below is Gravitino's OWN metadata
#     store (metalakes, catalogs, schemas as Gravitino entities) -> db "gravitino_meta"
#   - the Iceberg catalog's own "uri" property, set on the catalog object itself
#     via the POST /catalogs call (not in this file) -> db "iceberg_dynamic"

gravitino.server.shutdown.timeout = 3000

gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090

# ---- Gravitino's own entity store (JDBC/Postgres, not the H2 default) ----
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:postgresql://postgres:5432/gravitino_meta
gravitino.entity.store.relational.jdbcDriver = org.postgresql.Driver
gravitino.entity.store.relational.jdbcUser = iceberg
gravitino.entity.store.relational.jdbcPassword = iceberg

gravitino.catalog.cache.evictionIntervalMs = 3600000

gravitino.cache.enabled = true
gravitino.cache.maxEntries = 10000
gravitino.cache.expireTimeInMs = 3600000
gravitino.cache.enableStats = false
gravitino.cache.enableWeigher = true
gravitino.cache.implementation = caffeine

gravitino.fetchFile.blockUnsafeRemoteUri = true

# ---- authorization ----
# Left off for this demo -- wiring up Gravitino's permission model is out of
# scope here; every request in this rig is anonymous.
gravitino.authorization.enable = false
gravitino.server.visibleConfigs = gravitino.authorization.serviceAdmins
gravitino.authorization.serviceAdmins = anonymous

# ---- Iceberg REST as an auxiliary (embedded) service ----
gravitino.auxService.names = iceberg-rest
gravitino.iceberg-rest.classpath = iceberg-rest-server/libs, iceberg-rest-server/conf
gravitino.iceberg-rest.host = 0.0.0.0
gravitino.iceberg-rest.httpPort = 9001

# Dynamic provider: catalog config comes from Gravitino's own catalog entities
# (created via POST), not from static properties in this file -- there's no
# catalog-backend / warehouse / jdbc-* block here the way a standalone Iceberg
# REST config would have one; those live on the catalog object instead.
gravitino.iceberg-rest.catalog-config-provider = dynamic-config-provider
gravitino.iceberg-rest.gravitino-uri = http://localhost:8090
gravitino.iceberg-rest.gravitino-metalake = demo_metalake
gravitino.iceberg-rest.default-catalog-name = lake
