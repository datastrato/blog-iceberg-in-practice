connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog-dynamic:9001/iceberg/
# Dynamic mode: warehouse is the Gravitino catalog name, not a storage path or an
# empty string -- see the README's "warehouse means catalog name" gotcha.
iceberg.rest-catalog.warehouse=lake

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
